<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Plane Duo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <a class="back-link" href="/">Back to Dashboard</a>
  <div id="sceneGlow"></div>
  <div id="gameWrapper">
    <div id="topBar">
      <div class="mode-pill">DUO FLIGHT</div>
      <div class="mode-subtitle">Sky Cottage Pixel</div>
      <button id="btnAudio" class="sound-toggle" type="button">SOUND: ON</button>
    </div>
    <div id="scoreBoard">
      <div id="scoreP1" class="score-card">P1 (W): <span id="scoreValP1">0</span></div>
      <div id="scoreP2" class="score-card">P2 (UP): <span id="scoreValP2">0</span></div>
    </div>
    <div id="frameShell">
      <div class="frame-badge left">P1 W</div>
      <div class="frame-badge right">P2 UP</div>
      <canvas id="canvas" width="400" height="550"></canvas>
    </div>
    <div id="ui">SPACE OR CLICK TO START • P1: W • P2: ARROW UP</div>
    <div id="gameOverUi" style="display: none;">
      <button id="btnRestart" class="game-btn restart-btn">PLAY AGAIN (Space)</button>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
